services:
  - type: web
    name: vibe-admin-api
    env: docker
    plan: free
    # Chờ healthcheck endpoint phản hồi trước khi chuyển traffic
    healthCheckPath: /up
    envVars:
      - key: APP_NAME
        value: "Vibe Fashion"
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_KEY
        value: base64:+a41qblSk1RIlxmgZWG3U0bafEl/1WgQ2dUxxXFvb14=
      - key: APP_URL
        # Render sẽ tự động điền domain của bạn sau khi deploy
        value: https://vibe-admin-api.onrender.com
      - key: ASSET_URL
        value: https://vibe-admin-api.onrender.com

      # Database TiDB Serverless
      - key: DB_CONNECTION
        value: mysql
      - key: DB_HOST
        value: gateway01.ap-southeast-1.prod.aws.tidbcloud.com
      - key: DB_PORT
        value: 4000
      - key: DB_DATABASE
        value: test
      - key: DB_USERNAME
        value: 432CnJ3E1mRpuy1.root
      - key: DB_PASSWORD
        value: wIzsHWkKRiHq6xxT
      - key: MYSQL_ATTR_SSL_CA
        value: /etc/ssl/certs/ca-certificates.crt

      # Firebase (để xác thực token từ React Netlify)
      - key: FIREBASE_PROJECT_ID
        value: prefab-quote-q3bk6

      # URL của frontend Netlify (để cấu hình CORS)
      - key: FRONTEND_URL
        # Điền URL Netlify của bạn sau khi deploy
        value: https://vibeshop.netlify.app

      # Cache & Session
      - key: CACHE_DRIVER
        value: file
      - key: SESSION_DRIVER
        value: file
      - key: QUEUE_CONNECTION
        value: sync
